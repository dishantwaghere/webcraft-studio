
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | WebCraft Studio</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="dashboard-container">

        <header class="dashboard-header">
            <div>
                <h1>WebCraft<span>Studio</span></h1>
                <p>Admin Dashboard</p>
            </div>
            <button id="logoutBtn">Logout</button>
        </header>

        <main>
            <h2>Dashboard Overview</h2>
            <p class="subtitle">Manage your website enquiries.</p>

            <section class="stats">
                <div class="stat-card">
                    <p>Total Enquiries</p>
                    <h3 id="totalCount">0</h3>
                </div>

                <div class="stat-card">
                    <p>New Enquiries</p>
                    <h3 id="newCount">0</h3>
                </div>

                <div class="stat-card">
                    <p>Completed</p>
                    <h3 id="completedCount">0</h3>
                </div>
            </section>

            <section class="enquiries-section">
                <h2>Customer Enquiries</h2>
                <p id="dashboardMessage" role="status"></p>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Service</th>
                                <th>Message</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="enquiriesTable">
                            <tr>
                                <td colspan="6">Loading enquiries...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
